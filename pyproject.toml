[project]
name = "jssphinx"
description = "Improve developer experience"
readme = "README.rst"
version = "1.4.4"
dependencies = [
    "sphinx",
]
authors = [
    {name = "Artur Barseghyan", email = "artur.barseghyan@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Theme",
    "Framework :: Sphinx",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development",
]

[project.optional-dependencies]
all = ["jssphinx[themes,dev,test,build]"]
themes = [
    "sphinx-no-pragma",
    "sphinx-llms-txt-link",
    "sphinx-source-tree",
    "furo",
    "pydata-sphinx-theme",
    "sphinx-book-theme",
    "sphinx-bootstrap-theme",
    "sphinx-immaterial",
    "sphinx-material",
    "sphinx_rtd_theme",
]
dev = [
    "detect-secrets",
    "doc8",
    "ipython",
    "uv",
    "ruff",
]
test = [
    "fake.py",
    "pytest",
    "pytest-codeblock",
    "pytest-cov",
    "selenium",
    "get-chromedriver-py",
]
build = [
    "build",
    "twine",
    "wheel",
]

# Build system information below.
# NOTE: You don't need this in your own Black configuration.
[build-system]
requires = ["setuptools>=41.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 80
lint.select = [
    "B",  # Bugbear
    "C4",  # Complexity
    "E",  # Pycodestyle errors
    "F",  # Pyflakes errors
    "G",  # Logging format
    "I",  # Import sorting
    "ISC",  # Naming
    "INP",  # Implicit namespace
    "N",  # Naming
    "PERF",  # Performance
    "Q",  # Q for Q
    "SIM",  # Simplify
    "TD",  # TODO formatting
]
lint.ignore = [
    "G004",  # Allow f-strings in logging
    "ISC003",
    "TD002",
    "TD003",
]
# Enable auto-fix for formatting and import sorting
fix = true
src = ["src/pytest_codeblock"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docs",
]
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["PERF203"]

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = []

[tool.ruff.format]
# Ensure it uses the same style as Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.doc8]
ignore-path = [
    "docs/requirements.txt",
    "src/jssphinx.egg-info/SOURCES.txt",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "-vvv",
    "-q",
    "--cov=.",
    "--ignore=.tox",
    "--ignore=requirements",
    "--ignore=release",
    "--ignore=tmp",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=annotate",
    "--cov-append",
    "--capture=no",
]
#testpaths = [
#    "**/test*.py",
#    "**/*.rst",
#    "**/*.md",
#]
pythonpath = [
#    "src",
#    "examples/simple",
]
norecursedirs = [".git"]
DJANGO_SETTINGS_MODULE = "django_settings"

markers = [
    "slow: mark a test that takes a long time to run.",
    "codeblock: pytest-codeblock markers",
    "documentation: mark test as a documentation test",
    "fakepy: mark test as a fake.py test",
]

[tool.pytest-codeblock]
test_nameless_codeblocks = true

[tool.sphinx-source-tree]
ignore = [
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.py,cover",
    ".git",
    ".hg",
    ".svn",
    ".tox",
    ".nox",
    ".venv",
    "venv",
    "env",
    "*.egg-info",
    "dist",
    "build",
    "node_modules",
    ".mypy_cache",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".idea",
    ".vscode",
    ".DS_Store",
    "Thumbs.db",
    ".ruff_cache",
    ".coverage.*",
    ".secrets.baseline",
    ".pre-commit-config.yaml",
    ".pre-commit-hooks.yaml",
    ".readthedocs.yaml",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "LICENSE",
    "SECURITY.rst",
    "docs/_static",
    "docs/examples",
    "docs/changelog.rst",
    "docs/code_of_conduct.rst",
    "docs/security.rst",
    "docs/source_tree.rst",
    "docs/make.bat",
    "docs/Makefile",
    "docs/readme.rst",
    "docs/requirements.txt",
]
